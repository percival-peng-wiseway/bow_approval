name: Verify BOW OA
on:
  pull_request:
  push:
    branches: [main, QA, prod]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:release
      - run: npx wrangler deploy --dry-run --env QA --containers-rollout=none
      - run: docker build -f ocr/Dockerfile -t bow-ocr-check .
